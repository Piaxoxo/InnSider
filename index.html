    <!-- ─────────────────────────────────────────────────────────────────────
         Was im Dokument steht, bevor JavaScript läuft.

         ausführt. Google rendert inzwischen JavaScript, die Crawler der
         Backlink-Indizes (Ahrefs, Majestic, Moz) und viele kleinere aber
         nicht — ein Verweis, den nur die Anwendung erzeugt, existiert für sie
         schlicht nicht.

         Hier stehen deshalb dieselben Angaben, die der Gast auch im Fuß der
         fertigen Seite liest: Adresse, Telefon, E-Mail, die rechtlichen
         Seiten und der Urhebervermerk. Nichts Verstecktes, nichts, was der
         Besucher nicht auch sähe — React ersetzt diesen Block beim Start.
         Ohne JavaScript bleibt er stehen und ist für sich brauchbar.
         ───────────────────────────────────────────────────────────────── -->
    <div id="root">
